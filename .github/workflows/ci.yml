name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-tests:
    name: C++ engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DVDB_BUILD_TESTS=ON

      - name: Build
        run: cmake --build engine/build --config Release -j

      - name: Test
        working-directory: engine/build
        run: ctest --output-on-failure

  backend-tests:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vectordb
          POSTGRES_PASSWORD: vectordb
          POSTGRES_DB: vectordb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vectordb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Build native engine Python bindings
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DVDB_BUILD_TESTS=OFF -DVDB_BUILD_PYTHON_BINDINGS=ON
          cmake --build engine/build --config Release -j

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://vectordb:vectordb@localhost:5432/vectordb_test
          TEST_DATABASE_URL: postgresql+psycopg://vectordb:vectordb@localhost:5432/vectordb_test
          PYTHONPATH: ${{ github.workspace }}/engine/build/bindings
        run: pytest -q

  frontend-tests:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e-tests:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vectordb
          POSTGRES_PASSWORD: vectordb
          POSTGRES_DB: vectordb_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vectordb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://vectordb:vectordb@localhost:5432/vectordb_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start backend API in the background
        working-directory: backend
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:4173
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "backend did not become healthy in time"; cat ../backend.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend against the running backend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

      - name: Run Playwright tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4173
        run: |
          nohup npm run preview -- --port 4173 > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 > /dev/null && break
            sleep 1
          done
          npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
